# See docs at: https://mystmd.org/guide/frontmatter
version: 1

extends:
  - ./_site/site.yml

project:
  id: ca4d97b9-09e7-4ed5-9230-9dee58e5201c
  title: "POF Jupyter Book"
  # authors: ['Christopher Barnard', 'Joe McNorton', 'Francesca Di Giuseppe']
  github: https://github.com/ecmwf/AI-Probability-of-Fire

  toc:
    - file: index.md

    - file: Data_Information.md
      title: Data Information

    - title: PoF-Analysis
      children:
        - file: POF_Analysis_Data_Generator.ipynb
        - file: POF_Analysis_Trainer.ipynb
        - file: analysis.md
          children:
            - file: POF_Analysis.ipynb
        - file: plotting.md
          children:
            - file: POF_Analysis_Plotter.ipynb

    - title: PoF-Forecast
      children:
        - file: POF_Forecast_Data_Generator.ipynb
        - file: POF_Forecast_Trainer.ipynb
        - file: forecasting.md
          children:
            - file: POF_Forecast.ipynb
        - file: plotting.md
          children:
            - file: POF_Forecast_Plotter.ipynb

    - file: end.md                          # "Conclusion"
      title: Conclusion

site:
  template: book-theme
  options:
    favicon: images/favicon.ico
    logo: images/PoF-light.png
    logo_dark: images/PoF-dark.png
